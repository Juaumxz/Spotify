<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Passion+One:wght@400;700;900&family=Sriracha&display=swap" rel="stylesheet">

    <style>

        *{
            padding: 0px;
            margin: 0px;
        }

        body{
            background-image: linear-gradient(to top, rgb(0, 0, 0), rgb(60, 60, 60));
            height: 100vh;
            font-family: Inter;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        h2{
          text-align: center;
          margin: 20px 0px;
        }
        
        img{
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1/1;
            object-fit: cover;
            object-position: right;
            border: 2px solid rgba(133, 124, 124, 0.853);
            border-radius: 10px;
        }

        button{
            background-color: inherit;
            border: none;
            color: inherit;
        }

        #music > div{
            margin: 2%;
        }

        #music{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #nome{
            font-size: 20px;
            font-weight: bold;
        }

        #banda{
            color: gray;
        }

        #like > i{
            font-size: 20px;
        }

        #bar{
            background-color: grey;
            height: 4px;
            border-radius: 20px;
            width: 90%;
            align-self: center;
            margin: 20px;
        }

        #progresso{
            background-color: white;
            height: inherit;
            border-radius: 20px;
            width: 50%;
        }

        #botoes{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            margin-top: 5px;
        }
        
        .botm{
            font-size: 25px;
        }

        #play > i{
            font-size: 35px;
        }

        .bi:hover{
            color: rgb(90, 74, 255);
            cursor: pointer;
        }

    </style>
</head>
<body>
    <main>
        <h2 id="titulo">Spotify</h1>
        <img src="Capa.png" alt="">
        <audio id="audio" src="Sou da boca.mp3"></audio>

        <div id="music">
            <div>
                <div id="nome">Nome da Musica</div>
                <div id="banda">Nome da banda</div>
            </div>

            <div id="like"><i class="bi bi-heart"></i></div>
        </div>

                    <div id="bar">
                        <div id="progresso"></div>
                    </div>

         <div id="botoes">
            <button id="aleatorio"><i class="bi bi-shuffle"></i></button>
            <button id="voltar"><i class="bi bi-rewind-fill botm"></i></button>
            <button id="play"><i class="bi bi-play-circle botm"></i></button>
            <button id="avanc"><i class="bi bi-fast-forward-fill botm"></i></button>
            <button id="loop"><i class="bi bi-arrow-repeat"></i></button>
        </div>
    </main>

<script>

const nomeMusic = document.getElementById ('nome')
nomeMusic.innerText = 'Eu sou da boca agora rs'

const nomeBand = document.getElementById ('banda')
nomeBand.innerText = 'Cleitin'

const play = document.getElementById ('play')

const music = document.getElementById ('audio')

let tocando = false;

function playMusic(){
    play.querySelector('.bi').classList.remove('bi-play-circle');
    play.querySelector('.bi').classList.add('bi-pause-circle');
    music.play();
    tocando = true;
}

function pauseMusic(){
    play.querySelector('.bi').classList.remove('bi-pause-circle');
    play.querySelector('.bi').classList.add('bi-play-circle');
    music.pause();
    tocando = false;
}

function darPlayOuN(){
    if (tocando == false){
        playMusic();
    }else{
        pauseMusic();
    }

}

play.addEventListener('click', darPlayOuN)

</script>

</body>
</html>
